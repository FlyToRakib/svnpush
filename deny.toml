# cargo-deny: licences, advisories, bans and sources for every dependency.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in the Tauri/GTK tree are outside our control; direct
# dependencies are still checked.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

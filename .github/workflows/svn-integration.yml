name: svn-integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  svn-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Subversion
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y subversion
          else
            brew install subversion
          fi
          svn --version --quiet
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release protocol against file:// repositories
        run: cargo test -p svnpush-core --features svn-integration --test svn_integration --test run_integration

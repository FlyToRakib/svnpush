[workspace]
resolver = "2"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FlyToRakib/svnpush"
rust-version = "1.89"

[workspace.dependencies]
blake3 = "1.8"
ignore = "0.4"
jsonschema = { version = "0.56", default-features = false }
keyring = "4.2"
proptest = "1.11"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }
roxmltree = "0.21"
semver = "1.0"
similar = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
ts-rs = { version = "12.0", features = ["serde-json-impl", "no-serde-warnings"] }
ulid = "3.0"
walkdir = "2.5"
wiremock = "0.6"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Allow-list, each documented in docs/DECISIONS.md.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
